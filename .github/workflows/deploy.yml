name: Deploy SB Khush to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript check & tests
        run: |
          npm run lint
          npm test

      - name: Build production bundle
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_PAGES="${GITHUB_REPOSITORY_OWNER}.github.io"
          if [ "$REPO_NAME" = "$OWNER_PAGES" ]; then
            export VITE_BASE_PATH="/"
          elif [ -n "$REPO_NAME" ]; then
            export VITE_BASE_PATH="/${REPO_NAME}/"
          else
            export VITE_BASE_PATH="/Bazaar/"
          fi
          npm run build

      - name: Verify GitHub Pages bundle & PWA artifacts
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/pwa-192x192.png
          test -f dist/pwa-512x512.png
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
