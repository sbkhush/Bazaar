<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting — SB Khush</title>
    <script>
      (function () {
        var knownAppRoots = [
          'register',
          'login',
          'merchant',
          'super-admin',
          'dashboard',
          's',
          'shop',
          'product',
          'cart',
          'checkout',
          'order-success',
          'account',
          'tracking',
          'contact',
          'about',
          'faq',
          'return-policy',
          'terms',
          'privacy',
          'privacy-policy',
          'terms-and-conditions',
          'salesman',
          'sales-manager',
          'referral',
          'r',
          'admin'
        ];
        var l = window.location;
        var parts = l.pathname.split('/').filter(Boolean);
        var pathSegmentsToKeep =
          parts.length > 0 && knownAppRoots.indexOf(parts[0]) === -1 ? 1 : 0;

        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
