    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.setTimeout(function () {
        var root = document.getElementById('root');
        if (!window.__SBKHUSH_BOOTED__ && !window.__BAZAARPK_BOOTED__ && root && root.childElementCount === 0) {
          root.innerHTML =
            '<div style="font-family:Plus Jakarta Sans,system-ui,sans-serif;max-width:560px;margin:64px auto;padding:28px;border:1px solid #e2e8f0;border-radius:16px;background:#ffffff;color:#0f172a;box-shadow:0 4px 20px rgba(15,23,42,0.06);">' +
            '<h1 style="margin:0 0 10px;font-size:20px;font-weight:800;">SB Khush — Build Required for Static Hosting</h1>' +
            '<p style="margin:0 0 12px;font-size:13px;line-height:1.6;color:#475569;">The application bundle did not load on this host. If you deployed directly from the repository root branch on static hosting, enable the build workflow so the compiled <code>dist/</code> bundle is served.</p>' +
            '<p style="margin:0;font-size:12px;color:#64748b;">Or build locally with <code>npm run build</code> and publish the <code>dist/</code> folder.</p>' +
            '</div>';
        }
      }, 4000);
    </script>
  </body>
